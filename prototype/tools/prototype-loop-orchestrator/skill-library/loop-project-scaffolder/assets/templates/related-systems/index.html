<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{name} - 关联系统展示</title>
  <link rel="stylesheet" href="../assets/css/delivery-diagrams.css">
</head>
<body>
  <div class="diagram-layout" data-related-systems data-related-systems-state="empty">
    <header class="diagram-header">
      <div>
        <p class="diagram-kicker">RELATED SYSTEMS</p>
        <h1 class="diagram-title">关联系统展示</h1>
        <p class="diagram-summary">汇总当前项目涉及的外部平台、上下游系统及其关系。</p>
      </div>
      <div class="diagram-meta"><span class="diagram-meta__label">可选交付</span></div>
    </header>
    <main class="diagram-main">
      <section class="diagram-canvas">
        <div class="diagram-empty" data-related-systems-empty>
          <span class="diagram-empty__mark">关</span>
          <strong>暂无关联系统</strong>
          <p>当前项目未配置关联系统展示</p>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/delivery-nav.js"></script>
</body>
</html>
