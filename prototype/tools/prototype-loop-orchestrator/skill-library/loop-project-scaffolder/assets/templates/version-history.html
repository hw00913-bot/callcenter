<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>版本与变更 · {name}</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/version-history.css">
</head>
<body>
  <main class="version-page" data-version-history>
    <header class="version-page__header">
      <div>
        <p class="version-eyebrow">项目版本记录</p>
        <h1>版本与变更</h1>
        <p class="version-description">按版本查看需求、原型和开发交付状态，以及同一版本内的业务变更。</p>
      </div>
      <a class="version-button" href="index.html" data-delivery-switch="prototype" data-version-back>返回原型入口</a>
    </header>
    <div class="version-notice">评审时依次对照本版产品蓝图、业务流程与交互时序，再查看原型和已请求的功能说明。开发交接使用当前有效的批准交付包。这里展示清单记录，不执行批准，也不能作为开发开工授权。工作版可能继续变化；历史快照按冻结内容浏览，待批准或已失效的记录不能作为当前确认依据。</div>
    <p data-version-generated class="version-muted"></p>
    <div class="version-message" data-version-message role="status" aria-live="polite">公开版本投影尚未读取或不可用；当前批准状态未知。</div>
    <div class="version-layout" data-version-layout hidden>
      <aside class="version-sidebar" aria-label="版本列表">
        <h2>项目版本</h2>
        <p data-version-project class="version-muted"></p>
        <div data-version-list class="version-list"></div>
      </aside>
      <section data-version-detail class="version-detail" aria-label="所选版本" tabindex="-1"></section>
    </div>
    <noscript><p class="version-message">请启用 JavaScript 后查看版本清单。原型入口仍可正常访问。</p></noscript>
  </main>
  <script src="{version_index_script}" data-project-version-index></script>
  <script src="js/version-nav.js"></script>
  <script src="js/delivery-nav.js"></script>
</body>
</html>
