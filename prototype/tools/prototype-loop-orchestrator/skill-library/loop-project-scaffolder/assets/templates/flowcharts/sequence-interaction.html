<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{name} - 时序交互图</title>
  <link rel="stylesheet" href="../assets/css/delivery-diagrams.css">
</head>
<body>
  <div class="diagram-layout" data-delivery-diagram="sequence-interaction" data-diagram-state="empty">
    <header class="diagram-header">
      <div>
        <p class="diagram-kicker">SEQUENCE INTERACTION</p>
        <h1 class="diagram-title">时序交互图</h1>
        <p class="diagram-summary">呈现用户、原型页面与关联系统之间按时间顺序发生的请求、响应和状态变化。</p>
      </div>
      <div class="diagram-meta"><span class="diagram-meta__label">当前迭代</span></div>
    </header>
    <main class="diagram-main">
      <section class="diagram-canvas">
        <div class="diagram-empty" data-diagram-empty>
          <span class="diagram-empty__mark">序</span>
          <strong>尚未生成时序交互</strong>
          <p>当前迭代暂无可展示内容</p>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/delivery-nav.js"></script>
</body>
</html>
