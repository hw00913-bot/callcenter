<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{name} - 业务流程图</title>
  <link rel="stylesheet" href="../assets/css/delivery-diagrams.css">
</head>
<body>
  <div class="diagram-layout" data-delivery-diagram="business-process" data-diagram-state="empty">
    <header class="diagram-header">
      <div>
        <p class="diagram-kicker">BUSINESS PROCESS</p>
        <h1 class="diagram-title">业务流程图</h1>
        <p class="diagram-summary">呈现当前项目的参与角色、关键业务节点、判断条件和异常回流。</p>
      </div>
      <div class="diagram-meta"><span class="diagram-meta__label">当前迭代</span></div>
    </header>
    <main class="diagram-main">
      <section class="diagram-canvas">
        <div class="diagram-empty" data-diagram-empty>
          <span class="diagram-empty__mark">流</span>
          <strong>尚未生成业务流程</strong>
          <p>当前迭代暂无可展示内容</p>
        </div>
      </section>
    </main>
  </div>
  <script src="../js/delivery-nav.js"></script>
</body>
</html>
