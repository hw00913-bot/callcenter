    <script>
        /* 当前展开 */
        window.onload = function ()
        {
            $(".jklist ul li ul li#1").parent("ul").parent("li").children("span").removeClass("open").addClass("close");
            $(".jklist ul li ul li#1").parent("ul").css("display","block");
            $(".jklist ul li ul li#1 a").addClass("cure");

            $(".topbody .subTag ul li:nth-child(1) a").attr("class","apibg");
            $(".topbody .subTag ul li:nth-child(1) a").attr("style","color:#fff;");
        }

        $(function () {
            var url = location.href
            if(url.indexOf('?') > 0) {
                var param = url.split('?')[1].split('=')[1]
                $('.body-r .r_side').attr('src', param)
                var decodeUrl = decodeURI(param)
                $.each($('.body-l .jklist .section'), function(i, item) {
                    if($(item).data('url') == decodeUrl) {
                        var node = $(item).parents('ul')
                        node.siblings('span').removeClass('open').addClass('close')
                        node.slideDown('fast');
                        var superNode = $(item).parent('ul').parent('li').parent('ul')
                        superNode.siblings('span').removeClass('open').addClass('close')
                        superNode.slideDown('fast')
                        $(item).css('border', '1px solid #00825f');
                    }
                })
            }
        })
    </script>
