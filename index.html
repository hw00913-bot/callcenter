<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AliCti独立原型</title>
</head>
<body>
  <a href="prototype/index.html">进入AliCti独立原型</a>
  <script>
    (function () {
      var target = new URL('./prototype/index.html', window.location.href);
      var incoming = new URLSearchParams(window.location.search);
      var supported = new URLSearchParams();
      var tab = incoming.get('delivery_tab');
      if (/^(prototype|versions|docs|business-flow|sequence-flow|related-systems)$/.test(tab || '')) supported.set('delivery_tab', tab);
      if (incoming.get('delivery_embed') === '1') supported.set('delivery_embed', '1');
      target.search = supported.toString();
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>
