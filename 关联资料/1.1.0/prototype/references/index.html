<script>
  'use strict';
  let sourceRows = [];
  const get = id => document.getElementById(id);
  function node(tag, text, className) { const element = document.createElement(tag); if (text != null) element.textContent = text; if (className) element.className = className; return element; }
  function safeOfficialUrl(value) { try { const url = new URL(value); return ['http:', 'https:'].includes(url.protocol) && url.hostname === 'wiki.alicti.cn' ? url.href : null; } catch { return null; } }
  function render() {
    const query = get('query').value.trim().toLocaleLowerCase();
    const selected = sourceRows.filter(row => [row.id, row.name, row.endpoint, row.wiki_ref, row.sourceKey, row.officialPath].filter(Boolean).join(' ').toLocaleLowerCase().includes(query));
    get('rows').replaceChildren();
    for (const row of selected) {
      const tr = node('tr'); tr.id = row.id;
      tr.appendChild(node('td', row.id, 'ident'));
      const documentCell = node('td'); documentCell.appendChild(node('div', row.name, 'name')); documentCell.appendChild(node('div', row.endpoint || '文档 / 工具条方法', 'endpoint')); tr.appendChild(documentCell);
      const wikiCell = node('td'); wikiCell.appendChild(node('div', row.wiki_ref, 'wiki'));
      const status = row.wiki_status === 'current' ? '已核对可信' : row.wiki_status === 'partial' ? '部分可用' : row.wiki_status;
      wikiCell.appendChild(node('span', status, 'badge' + (row.wiki_status === 'partial' ? ' partial' : ''))); wikiCell.appendChild(node('span', row.knowledge_mode, 'source-key'));
      wikiCell.appendChild(node('div', row.sourceKey, 'source-key')); tr.appendChild(wikiCell);
      const sourceCell = node('td'); const official = safeOfficialUrl(row.url);
      if (official) { const link = node('a', '查看官方原文 ↗'); link.href = official; link.target = '_blank'; link.rel = 'noopener noreferrer'; sourceCell.appendChild(link); }
      const detail = node('details'); detail.appendChild(node('summary', '查看来源路径'));
      detail.appendChild(node('code', row.wiki_path, 'path'));
      for (const format of ['markdown', 'html']) { if (row.documents && row.documents[format]) detail.appendChild(node('code', 'raw/' + row.documents[format].path, 'path')); }
      sourceCell.appendChild(detail); tr.appendChild(sourceCell); get('rows').appendChild(tr);
    }
    get('result').textContent = `显示 ${selected.length} / ${sourceRows.length} 个来源`;
    get('empty').hidden = selected.length > 0;
  }
  async function start() {
    let index = JSON.parse(get('offline-index').textContent), mode = '离线索引 · 2026-10-13';
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      try {
        const response = await fetch('interface-sources.json', {cache: 'no-store'});
        if (!response.ok) throw new Error('Index request failed');
        const loaded = await response.json();
        if (loaded.schema_version !== 1 || !Array.isArray(loaded.sources)) throw new Error('Invalid index');
        index = loaded; mode = '来源索引 · ' + loaded.generatedAt;
      } catch { mode = '离线索引 · 无法读取最新索引'; }
    }
    sourceRows = index.sources;
    get('total').textContent = `${index.legacySourceCount} 个原来源 · ${index.supplementalSourceCount} 个补充索引`;
    get('mode').textContent = mode;
    let hash = '';
    try { hash = decodeURIComponent(location.hash.slice(1)); } catch { hash = ''; }
    if (sourceRows.some(row => row.id === hash)) get('query').value = hash;
    render();
  }
  get('query').addEventListener('input', render);
  window.addEventListener('hashchange', () => { try { get('query').value = decodeURIComponent(location.hash.slice(1)); } catch { get('query').value = ''; } render(); });
  start();
</script>
