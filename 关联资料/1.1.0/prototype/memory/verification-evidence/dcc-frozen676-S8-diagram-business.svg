<svg xmlns="http://www.w3.org/2000/svg" class="plantuml-diagram" role="img" aria-label="导入、结果分流与主子批闭环" data-diagram-type="business-process" data-renderer="plantuml" data-source-id="FLOW-001" data-flow-id="FLOW-001" data-plantuml-render="pass" version="1.1" width="1594px" height="729px" viewBox="0 0 1594 729" zoomAndPan="magnify" preserveAspectRatio="xMidYMin meet" contentstyletype="text/css" data-business-facts-sha256="239dc88259bc9835bbbd0ca300719f1c293848822e02f74f3285df99fe603ea3" data-business-svg-sha256="043a6d38742e48eea61033cbe8dfd97462f98a3abb2ff539c74b8b9ff492a09d" style=""><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="657.692" y="33.535" fill="#000" font-size="14" textLength="277.177" font-weight="700">FLOW-001 · 导入、结果分流与主子批闭环</text></g><ellipse cx="795.28" cy="62.488" rx="10" ry="10" fill="#315EFB" style="stroke:#222;stroke-width:1;"/><rect x="133.158" y="92.488" width="1324.244" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="143.158" y="114.09" fill="#25324A" font-size="12" textLength="1304.244">SC-005超管在应用接入独立建立或维护应用凭证：列表/详情/新增/修改/删除各可单独发起，普通修改保留密钥，精确删除不删业务记录。有效应用及授权租户范围作为DCC鉴权前置；日常页简化用途，原型只合成，真实凭证与token失效待核。</text><rect x="561.616" y="146.621" width="467.328" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="571.616" y="168.223" fill="#25324A" font-size="12" textLength="447.328">任务创建提交锁定接口/手工来源，校验tenant/原supplierTaskId，应用仅鉴权追踪</text><rect x="46.434" y="200.754" width="1497.693" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="56.434" y="222.355" fill="#25324A" font-size="12" textLength="1477.693">手工原输入/提交前统一逐条最终priority校验，有效行独立记录单号批次自动提交，不新增DCCflag/request/归组主子协议，无每日衰减；预外呼入口常驻、不可导入保留禁用原因，手工CSV当前文本/有效预览必须一致，新文本或失败预览不提交旧稿，历史补导不扩已启动规则</text><rect x="422.723" y="254.887" width="745.115" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="432.723" y="276.488" fill="#25324A" font-size="12" textLength="725.115">DCC请求级requestId可多行，新业务新ID，各行定位/leadCode/phone/本次priority/可选Boolean isNewBatch，missing=false归一</text><rect x="409.46" y="309.02" width="771.641" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="419.46" y="330.621" fill="#25324A" font-size="12" textLength="751.641">DCC鉴权及归属后先核requestId完整有效内容：同ID同内容返原逐行record/batch/root，不重拆交；异内容拒整重复，后来新主不改旧root</text><rect x="259.981" y="363.152" width="1070.598" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="269.981" y="384.754" fill="#25324A" font-size="12" textLength="1050.598">仅新ID逐行固定phone组校验：tenant/原supplierTaskId/leadCode，改号/归属冲突/历史组主不明不提交、多lead同号未决不自动放开，其他有效行继续；不要求DCC previous、不盲配最近同号</text><rect x="143.755" y="417.285" width="1303.051" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="153.755" y="438.887" fill="#25324A" font-size="12" textLength="1283.051">每有效新行新record/batch，true新主root=batch；false/缺省有主新子挂按本地主批稳定创建順序最近已保存同组主、无主自动首主，不挂上一子/不虚构parent。保存回执request/行/组/batch/root，本次priority/FIFO提交，未知不重交</text><rect x="405.47" y="471.418" width="779.621" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="415.47" y="493.02" fill="#25324A" font-size="12" textLength="759.621">53分片以核实enterprise→tenant/原task/fileId/原始号码精确回查实际记录与保存root，接口回传手工查看，不计实际呼叫不推定全导入终态</text><rect x="381.786" y="525.551" width="826.988" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="391.786" y="547.152" fill="#25324A" font-size="12" textLength="806.988">每次话单事件以实际批次/原始号码/callID或稳定事件精确关联，leadCode仅组不替代匹配；无话单失败独立、秒挂真实条件、重复晚更新不制造新呼叫</text><rect x="184.272" y="579.684" width="1222.016" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="194.272" y="601.285" fill="#25324A" font-size="12" textLength="1202.016">接口每次结果携保存request/行/组/实际batch/root/call事件回传固定DCC地址，后有新主不改旧root；手工仅查看，失败补送不重导；未可信纯SIP独立待核、不污染已确认call或阻挡其后可信精准更新，真实非SIP矛盾仍待核</text><rect x="16" y="633.816" width="1558.561" height="34.133" fill="#FFF" style="stroke:#8291A8;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="655.418" fill="#25324A" font-size="12" textLength="1538.561">DCC决定业务重导/priority/计数，新主子不重置计次；无平台每日查询/衰减/存量改写/重导计划。删除仅实际供应商批次，必要幂等/组/root/映射保留，原时间审计；同号重导排重执行中并行仍partial，不新增先删/等finishRetryFlag；切换精确删除目标/样例清旧反馈，不改旧对象证据</text><ellipse cx="795.28" cy="698.949" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="795.28" cy="698.949" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="795.28" y1="72.488" x2="795.28" y2="92.488" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,82.488,795.28,92.488,799.28,82.488,795.28,86.488" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="126.621" x2="795.28" y2="146.621" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,136.621,795.28,146.621,799.28,136.621,795.28,140.621" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="180.754" x2="795.28" y2="200.754" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,190.754,795.28,200.754,799.28,190.754,795.28,194.754" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="234.887" x2="795.28" y2="254.887" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,244.887,795.28,254.887,799.28,244.887,795.28,248.887" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="289.02" x2="795.28" y2="309.02" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,299.02,795.28,309.02,799.28,299.02,795.28,303.02" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="343.152" x2="795.28" y2="363.152" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,353.152,795.28,363.152,799.28,353.152,795.28,357.152" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="397.285" x2="795.28" y2="417.285" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,407.285,795.28,417.285,799.28,407.285,795.28,411.285" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="451.418" x2="795.28" y2="471.418" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,461.418,795.28,471.418,799.28,461.418,795.28,465.418" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="505.551" x2="795.28" y2="525.551" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,515.551,795.28,525.551,799.28,515.551,795.28,519.551" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="559.684" x2="795.28" y2="579.684" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,569.684,795.28,579.684,799.28,569.684,795.28,573.684" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="613.816" x2="795.28" y2="633.816" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,623.816,795.28,633.816,799.28,623.816,795.28,627.816" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="795.28" y1="667.949" x2="795.28" y2="687.949" style="stroke:#55657D;stroke-width:1;"/><polygon points="791.28,677.949,795.28,687.949,799.28,677.949,795.28,681.949" fill="#55657D" style="stroke:#55657D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></svg>