uestId及逐行leadCode/固定</tspan><tspan x="270.0" y="446">phone、isNewBatch可选Boolean、可</tspan><tspan x="270.0" y="464">选R和本次priority；missing </tspan><tspan x="270.0" y="482">isNewBatch=false</tspan></text><line x1="140" y1="494" x2="400" y2="494" stroke="#475467" stroke-width="1.7" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="5" data-message-type="internal"><title>5. [internal] [条件：已有requestId的相同业务重传] 先核鉴权/锁定source/tenant/原task；按isNewBatch缺省false归一的有效完整业务请求比requestId；同ID同内容读取原已保存逐行record/batch/root，不重建不重交，之后新主变化也不重算旧请求</title><text x="512" y="534" text-anchor="middle" font-size="12" fill="#475467" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="512" y="534">5. [internal] [条件：已有</tspan><tspan x="512" y="552">requestId的相同业务重传] 先核鉴权</tspan><tspan x="512" y="570">/锁定source/tenant/原task；按</tspan><tspan x="512" y="588">isNewBatch缺省false归一的有效完</tspan><tspan x="512" y="606">整业务请求比requestId；同ID同内容</tspan><tspan x="512" y="624">读取原已保存逐行</tspan><tspan x="512" y="642">record/batch/root，不重建不重交</tspan><tspan x="512" y="660">，之后新主变化也不重算旧请求</tspan></text><path d="M 400 672 h 84 v 30 h -84" fill="none" stroke="#475467" stroke-width="1.7" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="6" data-message-type="response"><title>6. [响应] [条件：已有requestId异内容] [API-001] 同requestId归一后的完整业务内容不同，整重复request冲突拒绝，不覆盖原逐行结果</title><text x="270.0" y="742" text-anchor="middle" font-size="12" fill="#11865b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="270.0" y="742">6. [响应] [条件：已有requestId异</tspan><tspan x="270.0" y="760">内容] [API-001] 同requestId归一</tspan><tspan x="270.0" y="778">后的完整业务内容不同，整重复request</tspan><tspan x="270.0" y="796">冲突拒绝，不覆盖原逐行结果</tspan></text><line x1="400" y1="808" x2="140" y2="808" stroke="#11865b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="7" data-message-type="internal"><title>7. [internal] [条件：新业务请求；其他有效行继续] 仅新requestId逐行校验必要字段和Boolean flag；同tenant/原task/leadCode固定phone归组，改phone或历史关联不明拒绝/待核不提交，不按最近同号猜根；同号多lead等既有未决歧义不自动许可/纳组</title><text x="512" y="848" text-anchor="middle" font-size="12" fill="#475467" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="512" y="848">7. [internal] [条件：新业务请求</tspan><tspan x="512" y="866">；其他有效行继续] 仅新requestId逐</tspan><tspan x="512" y="884">行校验必要字段和Boolean flag；同</tspan><tspan x="512" y="902">tenant/原task/leadCode固定</tspan><tspan x="512" y="920">phone归组，改phone或历史关联不明</tspan><tspan x="512" y="938">拒绝/待核不提交，不按最近同号猜根；</tspan><tspan x="512" y="956">同号多lead等既有未决歧义不自动许可/</tspan><tspan x="512" y="974">纳组</tspan></text><path d="M 400 986 h 84 v 30 h -84" fill="none" stroke="#475467" stroke-width="1.7" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="8" data-message-type="internal"><title>8. [internal] [条件：新请求逐行有效且归组可信] 每有效行总新recordId/batchId：isNewBatch=true为新独立主root=batch；false/missing有同组主则子直接root=最近已保存主，无主自动首主root=batch。最近主按保存创建序列，不按结果/priority；旧主子映射不改写</title><text x="512" y="1056" text-anchor="middle" font-size="12" fill="#475467" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="512" y="1056">8. [internal] [条件：新请求逐行</tspan><tspan x="512" y="1074">有效且归组可信] 每有效行总新</tspan><tspan x="512" y="1092">recordId/batchId：isNewBatch</tspan><tspan x="512" y="1110">=true为新独立主root=batch；</tspan><tspan x="512" y="1128">false/missing有同组主则子直接</tspan><tspan x="512" y="1146">root=最近已保存主，无主自动首主</tspan><tspan x="512" y="1164">root=batch。最近主按保存创建序列</tspan><tspan x="512" y="1182">，不按结果/priority；旧主子映射不</tspan><tspan x="512" y="1200">改写</tspan></text><path d="M 400 1212 h 84 v 30 h -84" fill="none" stroke="#475467" stroke-width="1.7" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="9" data-message-type="external_call"><title>9. [外部调用] [条件：新业务有效行已保存；同请求重传不执行] [API-002] 同任务待提交按本次priority高先/同级本地时间FIFO；每个实际新业务batch独立供应商fileId映射，不将root作fileId或追加旧fileId，不自动改isRepeat；已提交不重排、未知不重复</title><text x="530.0" y="1282" text-anchor="middle" font-size="12" fill="#475467" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="530.0" y="1282">9. [外部调用] [条件：新业务有效行已</tspan><tspan x="530.0" y="1300">保存；同请求重传不执行] [API-002] </tspan><tspan x="530.0" y="1318">同任务待提交按本次priority高先/同级</tspan><tspan x="530.0" y="1336">本地时间FIFO；每个实际新业务batch独</tspan><tspan x="530.0" y="1354">立供应商fileId映射，不将root作</tspan><tspan x="530.0" y="1372">fileId或追加旧fileId，不自动改</tspan><tspan x="530.0" y="1390">isRepeat；已提交不重排、未知不重复</tspan></text><line x1="400" y1="1402" x2="660" y2="1402" stroke="#475467" stroke-width="1.7" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="10" data-message-type="response"><title>10. [响应] [API-002] 同步result、fileId、taskId、importTotal、successTotal、invalidTotal；原始证据保留</title><text x="530.0" y="1442" text-anchor="middle" font-size="12" fill="#11865b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="530.0" y="1442">10. [响应] [API-002] 同步result</tspan><tspan x="530.0" y="1460">、fileId、taskId、importTotal、</tspan><tspan x="530.0" y="1478">successTotal、invalidTotal；原</tspan><tspan x="530.0" y="1496">始证据保留</tspan></text><line x1="660" y1="1508" x2="400" y2="1508" stroke="#11865b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="11" data-message-type="internal"><title>11. [internal] 保存当前record/batch→每条实际供应商fileId映射；准确同步成功正常记录，汇总不盲定行；明确失败不计呼叫，未知/矛盾待核；不保证同号再接收或无并行在途</title><text x="512" y="1548" text-anchor="middle" font-size="12" fill="#475467" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="512" y="1548">11. [internal] 保存当前</tspan><tspan x="512" y="1566">record/batch→每条实际供应商</tspan><tspan x="512" y="1584">fileId映射；准确同步成功正常记录，</tspan><tspan x="512" y="1602">汇总不盲定行；明确失败不计呼叫，未知</tspan><tspan x="512" y="1620">/矛盾待核；不保证同号再接收或无并行</tspan><tspan x="512" y="1638">在途</tspan></text><path d="M 400 1650 h 84 v 30 h -84" fill="none" stroke="#475467" stroke-width="1.7" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="12" data-message-type="response"><title>12. [响应] [API-001] 返回原已保存逐行接收结果、requestId/行定位/recordId/batchId/rootBatchId及tenant/task/leadCode/phone；flag false与missing归一一致，重传仍当时root；接受不等于拨号</title><text x="270.0" y="1720" text-anchor="middle" font-size="12" fill="#11865b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="270.0" y="1720">12. [响应] [API-001] 返回原已保存</tspan><tspan x="270.0" y="1738">逐行接收结果、requestId/行定位</tspan><tspan x="270.0" y="1756">/recordId/batchId/rootBatchId</tspan><tspan x="270.0" y="1774">及tenant/task/leadCode/phone；</tspan><tspan x="270.0" y="1792">flag false与missing归一一致，重传</tspan><tspan x="270.0" y="1810">仍当时root；接受不等于拨号</tspan></text><line x1="400" y1="1822" x2="140" y2="1822" stroke="#11865b" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="13" data-message-type="event"><title>13. [事件] [条件：供应商配置失败事件推送；零失败无推送保证] [API-003] 53导入失败分片：企业/任务/fileId、总失败数、总片数/片号、failedTelList原始数据及原因</title><text x="530.0" y="1862" text-anchor="middle" font-size="12" fill="#7a4cc2" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="530.0" y="1862">13. [事件] [条件：供应商配置失败事件</tspan><tspan x="530.0" y="1880">推送；零失败无推送保证] [API-003] </tspan><tspan x="530.0" y="1898">53导入失败分片：企业/任务/fileId、</tspan><tspan x="530.0" y="1916">总失败数、总片数/片号、</tspan><tspan x="530.0" y="1934">failedTelList原始数据及原因</tspan></text><line x1="660" y1="1946" x2="400" y2="1946" stroke="#7a4cc2" stroke-width="1.7" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="14" data-message-type="internal"><title>14. [internal] 按已保存当前batch→fileId及原号码数据关联53失败，补齐原record/request行/root；合并失败分片、去重/迟到不丢，冲突待核；分片号不是业务主根，片齐不证明全导入终态</title><text x="512" y="1986" text-anchor="middle" font-size="12" fill="#475467" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="512" y="1986">14. [internal] 按已保存当前</tspan><tspan x="512" y="2004">batch→fileId及原号码数据关联53失</tspan><tspan x="512" y="2022">败，补齐原record/request行</tspan><tspan x="512" y="2040">/root；合并失败分片、去重/迟到不丢</tspan><tspan x="512" y="2058">，冲突待核；分片号不是业务主根，片齐</tspan><tspan x="512" y="2076">不证明全导入终态</tspan></text><path d="M 400 2088 h 84 v 30 h -84" fill="none" stroke="#475467" stroke-width="1.7" marker-end="url(#sequence-arrow-SEQ-001)"/></g><g data-message-index="15" data-message-type="external_call"><title>15. [外部调用] [条件：锁定接口来源及后台固定地址] [API-010] 导入失败携原requestId/行定位/recordId/当前batchId/已存rootBatchId和原因回传；失败待补送，不重做导入不计呼叫，手工仅平台查看</title><text x="270.0" y="2158" text-anchor="middle" font-size="12" fill="#475467" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><tspan x="270.0" y="2158">15. [外部调用] [条件：锁定接口来源及</tspan><tspan x="270.0" y="2176">后台固定地址] [API-010] 导入失败携</tspan><tspan x="270.0" y="2194">原requestId/行定位/recordId/当前</tspan><tspan x="270.0" y="2212">batchId/已存rootBatchId和原因回</tspan><tspan x="270.0" y="2230">传；失败待补送，不重做导入不计呼叫，手</tspan><tspan x="270.0" y="2248">工仅平台查看</tspan></text><line x1="400" y1="2260" x2="140" y2="2260" stroke="#475467" stroke-width="1.7" marker-end="url(#sequence-arrow-SEQ-001)"/></g></svg>