<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史阶段记录 · 云培育中心 2.0.0</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/version-history.css">
</head>
<body data-working-version-id="v2.1.0">
  <main class="version-page" data-version-history data-version-history-archive>
    <header class="version-page__header">
      <div>
        <p class="version-eyebrow">历史归档 · 清单于 2026-11-12 生成</p>
        <h1>历史阶段记录</h1>
        <p class="version-description"><a href="../index.html">返回 2.0.0 版本首页</a> · <a href="index.html?view=changes">查看当前原型变更对比（1.2.0 → 2.0.0）</a></p>
      </div>
      <a class="version-button" href="index.html" data-delivery-switch="prototype" data-version-back>返回原型入口</a>
    </header>
    <div class="version-notice"><strong>以下只是历史记录。</strong> 清单中的 v2.1.0 是旧内部标识，阶段状态不代表当前 2.0.0。当前需求以 r12 正式冻结包为准；它不代表原型已通过评审或研发已获开工批准。</div>
    <p data-version-generated class="version-muted"></p>
    <div class="version-message" data-version-message role="status" aria-live="polite">历史阶段清单尚未加载或不可用；不影响当前 2.0.0 版本。</div>
    <div class="version-layout" data-version-layout hidden>
      <aside class="version-sidebar" aria-label="版本列表">
        <h2>项目版本</h2>
        <p data-version-project class="version-muted"></p>
        <div data-version-list class="version-list"></div>
      </aside>
      <section data-version-detail class="version-detail" aria-label="所选版本" tabindex="-1"></section>
    </div>
    <noscript><p class="version-message">请启用 JavaScript 后查看版本清单。原型入口仍可正常访问。</p></noscript>
  </main>
  <script src="./版本清单.js" data-project-version-index></script>
  <script src="js/version-nav.js"></script>
  <script src="js/delivery-nav.js"></script>
</body>
</html>
